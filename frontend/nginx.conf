server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 110m;

    # Resolve the Compose service again when the API container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /_recorder_auth {
        internal;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream/api/entities/recording_access/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Accept application/json;
    }

    location /recorder/ {
        auth_request /_recorder_auth;
        set $recorder_upstream api:7900;
        rewrite ^/recorder/(.*)$ /$1 break;
        proxy_pass http://$recorder_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 1800s;
        add_header Cache-Control "no-store" always;
    }

    # Static Vite bundles live under /assets/, while Vue Router also uses
    # routes such as /assets/flow. Match real static file extensions only so
    # those client-side routes fall through to the SPA entry point.
    location ~* ^/assets/.+\.(?:js|css|map|json|svg|png|jpe?g|gif|webp|woff2?|ttf)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vue Router history routes must also work when opened or refreshed directly.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
